<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4f8">
  <title>Ateliê da Lili — salão de beleza</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #60485c;
      --pink: #f178a5;
      --pink-dark: #dc5d8c;
      --soft-pink: #fff0f5;
      --lilac: #f1edff;
      --cream: #fffaf0;
      --mint: #e4f8ef;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
      color: var(--ink);
      background: #fff8fb;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 8%, #ffe7f0 0, transparent 26rem),
        radial-gradient(ellipse at 90% 88%, #e8e5ff 0, transparent 28rem),
        #fffafc;
    }

    button { font: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 18px 24px 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 3px solid white;
      border-radius: 18px;
      background: #ffdeeb;
      box-shadow: 0 4px 12px #e8b4c880;
      font-size: 28px;
    }

    h1 {
      margin: 0;
      color: #a6537a;
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: #9d8298;
      font-size: .9rem;
    }

    .reset-button {
      min-height: 44px;
      padding: 9px 16px;
      border: 2px solid #f1dce6;
      border-radius: 16px;
      background: #fff;
      color: #8e6f84;
      cursor: pointer;
      font-weight: 800;
    }

    .reset-button:hover { background: var(--soft-pink); }

    .salon {
      display: grid;
      grid-template-columns: minmax(170px, 210px) minmax(280px, 1fr) minmax(220px, 270px);
      gap: 18px;
      align-items: stretch;
    }

    .card {
      border: 3px solid #fff;
      border-radius: 28px;
      background: #ffffffdf;
      box-shadow: 0 12px 32px #bc8fa51a, 0 3px 8px #bc8fa512;
    }

    .menu {
      padding: 17px 14px;
    }

    .eyebrow {
      margin: 0 0 12px 5px;
      color: #a58b9d;
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .tab {
      display: flex;
      width: 100%;
      min-height: 74px;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      padding: 10px 12px;
      border: 3px solid transparent;
      border-radius: 21px;
      background: #fff8fc;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: transform .15s ease, background .15s ease;
    }

    .tab:hover, .choice:hover, .color-choice:hover { transform: translateY(-2px); }
    .tab[aria-pressed="true"] {
      border-color: #f2b1c9;
      background: #fff0f6;
      box-shadow: 0 4px 0 #f8d5e2;
    }

    .tab-icon {
      display: grid;
      width: 45px;
      height: 45px;
      flex: 0 0 45px;
      place-items: center;
      border-radius: 15px;
      background: #ffe2ed;
      font-size: 25px;
    }

    .tab:nth-of-type(3) .tab-icon { background: #e8e2ff; }
    .tab strong { display: block; font-size: 1rem; }
    .tab small { display: block; margin-top: 3px; color: #a38a9b; font-size: .75rem; }

    .stage {
      position: relative;
      display: flex;
      min-height: 570px;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 22px 18px 20px;
      background:
        radial-gradient(ellipse at 50% 55%, #fff 0, #fff9fd 42%, transparent 75%),
        linear-gradient(145deg, #f4efff, #fff0f6 70%, #fff7e8);
    }

    .stage::before, .stage::after {
      position: absolute;
      z-index: 0;
      color: #f4a9c5;
      content: "✦";
      opacity: .65;
      pointer-events: none;
    }
    .stage::before { top: 18%; left: 9%; font-size: 27px; }
    .stage::after { top: 30%; right: 9%; font-size: 21px; }

    .stage-heading, .art-wrap, .speech {
      position: relative;
      z-index: 1;
    }

    .stage-heading {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: #a6537a;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .stage-heading span { font-size: 1.4rem; }

    .art-wrap {
      display: grid;
      width: min(100%, 420px);
      flex: 1;
      min-height: 360px;
      place-items: center;
    }

    .character {
      width: 100%;
      max-height: 440px;
      filter: drop-shadow(0 12px 10px #ad77932b);
      overflow: visible;
    }

    .hair-back, .hair-front { transition: opacity .2s ease; }
    .hair-back path, .hair-front path { fill: var(--hair-color, #9a5b48); }
    .hair-accent { fill: var(--hair-light, #c98770); }
    .eyes { fill: #60485c; }
    .nail { fill: var(--nail-color, #ff8fae); transition: fill .2s ease; }
    .nail-decoration { fill: var(--nail-decoration, #fff2a8); }

    .speech {
      min-height: 45px;
      padding: 11px 19px;
      border: 2px solid #fff;
      border-radius: 20px;
      background: #ffffffdf;
      box-shadow: 0 4px 12px #ba8ca526;
      color: #986885;
      font-size: .96rem;
      font-weight: 800;
      text-align: center;
    }

    .controls {
      padding: 20px 17px;
    }

    .controls h2 {
      margin: 0 0 5px;
      color: #a6537a;
      font-size: 1.2rem;
    }

    .hint {
      margin: 0 0 17px;
      color: #a38a9b;
      font-size: .83rem;
      line-height: 1.4;
    }

    .option-group + .option-group { margin-top: 18px; }

    .group-title {
      margin: 0 0 9px;
      color: #80677c;
      font-size: .82rem;
      font-weight: 900;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .choice {
      display: flex;
      min-height: 67px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      border: 2px solid #f1e6ef;
      border-radius: 17px;
      background: #fff;
      color: #755c71;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease;
    }

    .choice[aria-pressed="true"] {
      border-color: #e98bb0;
      background: #fff2f7;
      box-shadow: 0 2px 0 #f8d8e4;
    }

    .choice .emoji { font-size: 22px; line-height: 1; }
    .choice span:last-child { font-size: .72rem; font-weight: 800; }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 2px;
    }

    .color-choice {
      width: 39px;
      height: 39px;
      padding: 0;
      border: 3px solid #fff;
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 2px #eadce7;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .color-choice[aria-pressed="true"] {
      box-shadow: 0 0 0 3px #bd7295, 0 0 0 6px #f8dce8;
    }

    .finish-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 11px;
      border-radius: 15px;
      background: #f0fbf5;
      color: #6f9a82;
      font-size: .76rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .finish-note span { font-size: 21px; }
    [hidden] { display: none !important; }

    button:focus-visible {
      outline: 4px solid #8e78d0;
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .salon { grid-template-columns: 165px minmax(0, 1fr); }
      .stage { grid-column: 2; grid-row: 1 / span 2; min-height: 570px; }
      .menu { grid-column: 1; }
      .controls { grid-column: 1; }
      .choices { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 590px) {
      .app { padding: 12px 12px 20px; }
      .brand-mark { width: 45px; height: 45px; border-radius: 15px; }
      .subtitle { font-size: .76rem; }
      .reset-button { min-height: 40px; padding: 7px 10px; font-size: .82rem; }
      .salon { grid-template-columns: 1fr; gap: 12px; }
      .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
      .menu .eyebrow { grid-column: 1 / -1; margin: 0 0 0 3px; }
      .tab { min-height: 62px; margin: 0; padding: 8px; gap: 8px; }
      .tab-icon { width: 38px; height: 38px; flex-basis: 38px; font-size: 21px; }
      .tab small { display: none; }
      .stage { grid-column: 1; grid-row: auto; min-height: 455px; padding: 15px 12px; }
      .art-wrap { min-height: 330px; }
      .character { max-height: 350px; }
      .controls { grid-column: 1; padding: 16px; }
      .controls .choices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .choice { min-height: 62px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">🐱</div>
        <div>
          <h1>Ateliê da Lili</h1>

      <button class="reset-button" id="reset" type="button">↻ Começar de novo</button>
    </header>

    <main class="salon">
      <nav class="menu card" aria-label="Escolha uma atividade">
        <p class="eyebrow">Vamos brincar de...</p>
        <button class="tab" type="button" data-mode="hair" aria-pressed="true">
          <span class="tab-icon" aria-hidden="true">💇‍♀️</span>
          <span><strong>Cabelo</strong><small>Penteados e cores</small></span>
        </button>
        <button class="tab" type="button" data-mode="nails" aria-pressed="false">
          <span class="tab-icon" aria-hidden="true">💅</span>
          <span><strong>Unhas</strong><small>Cores e brilhinhos</small></span>
        </button>
      </nav>

      <section class="stage card" aria-label="Lili no salão">
        <div class="stage-heading"><span aria-hidden="true">✿</span><span id="stage-title">Dia de cuidar do cabelo!</span><span aria-hidden="true">✿</span></div>
        <div class="art-wrap">

        <div class="speech" id="message" aria-live="polite">Escolha um penteado para a Lili!</div>

      <aside class="controls card" aria-label="Opções de beleza">
        <h2 id="control-title">Meu cabelo</h2>
        <p class="hint" id="control-hint">Toque no que você mais gostar.</p>

        <div id="hair-controls">
          <div class="option-group">
            <p class="group-title">Penteado</p>

            </div>
          </div>
          <div class="option-group">
            <p class="group-title">Cor do cabelo</p>
            <div class="swatches" id="hair-colors" aria-label="Cores de cabelo">
              <button class="color-choice" type="button" style="--swatch:#9a5b48" data-color="#9a5b48" data-light="#c98770" aria-label="Castanho" aria-pressed="true"></button>
              <button class="color-choice" type="button" style="--swatch:#e8a33c" data-color="#e8a33c" data-light="#ffd16b" aria-label="Dourado" aria-pressed="false"></button>
              <button class="color-choice" type="button" style="--swatch:#d967a0" data-color="#d967a0" data-light="#f8a4c8" aria-label="Rosa" aria-pressed="false"></button>

              <button class="color-choice" type="button" style="--swatch:#69bba2" data-color="#69bba2" data-light="#a4e3ca" aria-label="Verde-água" aria-pressed="false"></button>
            </div>
          </div>
        </div>

        <div id="nail-controls" hidden>
          <div class="option-group">
            <p class="group-title">Cor das patinhas</p>
            <div class="swatches" id="nail-colors" aria-label="Cores de esmalte">
              <button class="color-choice" type="button" style="--swatch:#ff8fae" data-color="#ff8fae" aria-label="Rosa" aria-pressed="true"></button>
              <button class="color-choice" type="button" style="--swatch:#ffcf67" data-color="#ffcf67" aria-label="Amarelo" aria-pressed="false"></button>
              <button class="color-choice" type="button" style="--swatch:#8ecde0" data-color="#8ecde0" aria-label="Azul" aria-pressed="false"></button>
              <button class="color-choice" type="button" style="--swatch:#a9d9a0" data-color="#a9d9a0" aria-label="Verde" aria-pressed="false"></button>
              <button class="color-choice" type="button" style="--swatch:#c2a3ec" data-color="#c2a3ec" aria-label="Lilás" aria-pressed="false"></button>
              <button class="color-choice" type="button" style="--swatch:#ff9f74" data-color="#ff9f74" aria-label="Laranja" aria-pressed="false"></button>
            </div>
          </div>
          <div class="option-group">
            <p class="group-title">Enfeite</p>
            <div class="choices" id="nail-decorations">
              <button class="choice" type="button" data-decoration="shine" aria-pressed="true"><span class="emoji">✨</span><span>Brilhinho</span></button>
              <button class="choice" type="button" data-decoration="heart" aria-pressed="false"><span class="emoji">💗</span><span>Coração</span></button>
              <button class="choice" type="button" data-decoration="dots" aria-pressed="false"><span class="emoji">⚪</span><span>Bolinha</span></button>
              <button class="choice" type="button" data-decoration="none" aria-pressed="false"><span class="emoji">🌷</span><span>Sem enfeite</span></button>
            </div>
          </div>
        </div>

        <div class="finish-note"><span aria-hidden="true">🌈</span><span>Não tem jeito errado de brincar. Escolha o que você gostar!</span></div>
      </aside>
    </main>
  </div>

        },
        bun: {
          back: '<path d="M77 169 Q57 100 104 62 Q122 21 178 35 Q232 15 267 62 Q312 89 290 173 L274 219 Q248 245 222 211 L137 218 Q109 254 82 222Z"/><circle cx="178" cy="43" r="31"/><circle cx="180" cy="28" r="14" class="hair-accent"/><path d="M92 80 Q109 31 142 41 Q123 73 123 111Z" class="hair-accent"/>',
          front: '<path d="M91 132 Q86 54 151 45 Q231 24 272 93 Q247 80 225 94 Q193 109 165 90 Q132 125 91 132Z"/><path d="M105 99 Q125 55 163 53 Q137 78 135 106Z" class="hair-accent"/>',
          accessory: '<path d="M239 70 Q224 57 221 70 Q220 80 239 84 Q258 80 257 70 Q254 57 239 70Z" fill="#ffcf67" stroke="#e8a94d" stroke-width="2"/><circle cx="239" cy="73" r="4" fill="#fff5c8"/>'
        }
      };

      function selectOnly(button, group) {
        group.querySelectorAll("button").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
      }

      function setMode(mode) {
        const isHair = mode === "hair";
        tabs.forEach((tab) => tab.setAttribute("aria-pressed", String(tab.dataset.mode === mode)));
        hairControls.hidden = !isHair;
        nailControls.hidden = isHair;
        stageTitle.textContent = isHair ? "Dia de cuidar do cabelo!" : "Dia de cuidar das patinhas!";
        controlTitle.textContent = isHair ? "Meu cabelo" : "Minhas unhas";
        controlHint.textContent = isHair ? "Toque no que você mais gostar." : "Vamos escolher uma cor bem bonita!";
        message.textContent = isHair ? "Escolha um penteado para a Lili!" : "Escolha a cor das patinhas!";
      }

      tabs.forEach((tab) => tab.addEventListener("click", () => setMode(tab.dataset.mode)));

      document.querySelector("#hair-styles").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-style]");
        if (!button) return;
        selectOnly(button, document.querySelector("#hair-styles"));
        const style = styleMarkup[button.dataset.style];
        hairBack.innerHTML = style.back;
        hairFront.innerHTML = style.front;
        accessory.innerHTML = style.accessory;
        message.textContent = `Que lindo! A Lili adorou o cabelo ${button.dataset.style === "bob" ? "curtinho" : button.textContent.trim().toLowerCase()}!`;
      });

      document.querySelector("#hair-colors").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-color]");
        if (!button) return;
        selectOnly(button, document.querySelector("#hair-colors"));
        root.style.setProperty("--hair-color", button.dataset.color);
        root.style.setProperty("--hair-light", button.dataset.light);
        message.textContent = `Uma cor linda para o cabelo da Lili!`;
      });

      document.querySelector("#nail-colors").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-color]");
        if (!button) return;
        selectOnly(button, document.querySelector("#nail-colors"));
        nails.forEach((nail) => nail.style.setProperty("--nail-color", button.dataset.color));
        message.textContent = "As patinhas ficaram coloridas. Que beleza!";
      });

      document.querySelector("#nail-decorations").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-decoration]");
        if (!button) return;
        selectOnly(button, document.querySelector("#nail-decorations"));
        const decoration = button.dataset.decoration;
        if (decoration === "none") {
          decorations.style.display = "none";
        } else {
          decorations.style.display = "";
          const positions = [[108, 349], [122, 356], [91, 355], [252, 349], [238, 356], [269, 355]];
          const fill = decoration === "shine" ? "#fff2a8" : decoration === "heart" ? "#ff8db3" : "#ffffff";
          decorations.innerHTML = positions.map(([x, y]) => {
            if (decoration === "heart") {
              return `<path d="M${x} ${y + 2} C${x - 7} ${y - 3} ${x - 3} ${y - 8} ${x} ${y - 4} C${x + 3} ${y - 8} ${x + 7} ${y - 3} ${x} ${y + 2}Z" fill="${fill}"/>`;
            }
            if (decoration === "dots") return `<circle cx="${x}" cy="${y}" r="2.8" fill="${fill}"/>`;
            return `<path d="M${x} ${y - 4} L${x + 1} ${y - 1} L${x + 4} ${y} L${x + 1} ${y + 1} L${x} ${y + 4} L${x - 1} ${y + 1} L${x - 4} ${y} L${x - 1} ${y - 1}Z" fill="${fill}"/>`;
          }).join("");
        }
        message.textContent = decoration === "none" ? "Também fica lindo sem enfeites!" : "Um enfeite especial para as patinhas!";
      });

      document.querySelector("#reset").addEventListener("click", () => {
        root.style.setProperty("--hair-color", "#9a5b48");
        root.style.setProperty("--hair-light", "#c98770");
        nails.forEach((nail) => nail.style.setProperty("--nail-color", "#ff8fae"));
        decorations.style.display = "";
        decorations.innerHTML = originalDecorations;
        hairBack.innerHTML = originalHair.back;
        hairFront.innerHTML = originalHair.front;
        accessory.innerHTML = originalHair.accessory;
        document.querySelectorAll(".choice, .color-choice").forEach((button) => {
          button.setAttribute("aria-pressed", String(
            button.dataset.style === "long" ||
            button.dataset.color === "#9a5b48" ||
            button.dataset.color === "#ff8fae" ||
            button.dataset.decoration === "shine"
          ));
        });
        setMode("hair");
      });
    })();
  </script>
</body>
</html>
